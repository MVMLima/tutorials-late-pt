project:
  type: book
  output-dir: _site
  execute-dir: project
  resources:
    - data

book:
  title: "Modelagem de cenários para análise de surtos com R"
  subtitle: "Matrizes de contato, simulação da transmissão, intervenções e carga de doença"
  author: |
    Adaptação para o português: Marcos V. M. de Lima<br>
    Material original: Epiverse-TRACE (CC-BY 4.0)
  date: "2026-09-20"
  chapters:
    - index.qmd
    - setup.qmd
    - episodios/01-matrizes-de-contato.qmd
    - episodios/02-simular-transmissao.qmd
    - episodios/03-escolher-modelo.qmd
    - episodios/04-modelar-intervencoes.qmd
    - episodios/05-comparar-intervencoes.qmd
    - episodios/06-comparar-vacinacao.qmd
    - episodios/07-carga-de-doenca.qmd
  appendices:
    - perfis.qmd
    - glossario.qmd
    - instrutor.qmd
    - licenca.qmd
  repo-url: https://github.com/MVMLima/tutorials-late-pt
  repo-actions: [edit, issue]
  search: true
  sharing: [twitter, linkedin]
  page-footer:
    left: "Baseado em Epiverse-TRACE *Tutorials Late* (CC-BY 4.0)"
    right: "Adaptação PT-BR: Marcos V. M. de Lima"
  sidebar:
    style: docked
    search: true
  favicon: img/pkgs-hexlogos.png

format:
  html:
    lang: pt-BR
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    number-sections: false
    code-copy: true
    code-overflow: wrap
    code-summary: "Código"
    code-line-numbers: false
    fig-cap-location: bottom
    tbl-cap-location: top
    link-external-newwindow: true
    highlight-style: github

execute:
  freeze: auto
  error: true
  warning: true
